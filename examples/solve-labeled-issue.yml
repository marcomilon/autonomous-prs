name: Autonomous PRs - solve labeled issue

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  solve:
    if: >-
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'ready-for-ai' &&
        github.event.issue.state == 'open' &&
        github.event.issue.pull_request == null
      ) || (
        github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/autonomous retry') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.issue.labels.*.name, 'needs-clarification') &&
        github.event.issue.state == 'open' &&
        github.event.issue.pull_request == null
      )
    uses: marcomilon/autonomous-prs/.github/workflows/solve-labeled-issue.yml@v5
    with:
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
      issue_body: ${{ github.event.issue.body }}
      default_branch: ${{ github.event.repository.default_branch }}
    secrets:
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
