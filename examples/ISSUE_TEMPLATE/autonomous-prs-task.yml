name: Autonomous PR task
description: Submit a well-defined product task for Autonomous PRs.
title: "[Task]: "
labels:
  - ready-for-ai
body:
  - type: markdown
    attributes:
      value: |
        Complete the required sections before submitting. This issue will be picked up automatically by Autonomous PRs.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user, business, or product problem should be solved?
      placeholder: Describe the problem and who it affects.
    validations:
      required: true
  - type: textarea
    id: desired_outcome
    attributes:
      label: Desired outcome
      description: What should be true when this work is complete?
      placeholder: Describe the expected result from a user's perspective.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List concrete conditions that define a successful solution.
      placeholder: |
        - A user can ...
        - The page shows ...
        - Existing behavior ...
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Identify affected areas and anything explicitly out of scope.
      placeholder: |
        In scope: ...
        Out of scope: ...
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: Add links, screenshots, examples, technical constraints, or related issues when useful.
    validations:
      required: false
